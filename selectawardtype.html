<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Select Award Type</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="icon" type="image/png" href="images/BBapplogo.png">

<link rel="apple-touch-icon" href="images/BBapplogo.png">

<link rel="manifest" href="manifest.json">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#002b88;
    min-height:100vh;
}

/* ================= HEADER ================= */

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 30px;
    color:white;
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo img{
    width:85px;
    height:85px;
    object-fit:contain;
}

.logo h1{
    font-size:42px;
}

.logo p{
    font-size:18px;
    margin-top:5px;
}

/* ================= BACK BUTTON ================= */

.back-btn{
    width:75px;
    height:75px;
    border:none;
    border-radius:50%;
    background:#f3dca3;
    color:#032b84;
    font-size:30px;
    cursor:pointer;
    box-shadow:0 5px 12px rgba(0,0,0,0.25);
}

/* ================= CONTAINER ================= */

.container{
    width:90%;
    max-width:950px;
    margin:40px auto;
    background:white;
    border-radius:30px;
    padding:60px 50px;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

/* ================= TITLE ================= */

.title{
    text-align:center;
    font-size:65px;
    color:#001f70;
    margin-bottom:60px;
    font-weight:bold;
}

/* ================= BUTTONS ================= */

.award-btn{
    width:100%;
    border:none;
    border-radius:25px;
    background:#032b84;
    color:white;
    padding:35px;
    font-size:42px;
    font-weight:bold;
    margin-bottom:35px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 5px 12px rgba(0,0,0,0.25);
}

.award-btn:hover{
    transform:scale(1.02);
    background:#001f70;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

    .logo h1{
        font-size:28px;
    }

    .logo p{
        font-size:14px;
    }

    .title{
        font-size:40px;
    }

    .award-btn{
        font-size:28px;
        padding:25px;
    }

    .container{
        padding:40px 25px;
    }

}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<div class="top-bar">

    <div class="logo">

        <img src="images/bb.logo.png">

        <div>

            <h1>BB COMPANY</h1>
            <p>MANAGEMENT APP</p>

        </div>

    </div>

    <!-- BACK -->

    <button class="back-btn"
    onclick="window.location.href='achievements.html'">

        <i class="fa-solid fa-arrow-left"></i>

    </button>

</div>

<!-- ================= MAIN ================= -->

<div class="container">

    <h1 class="title">
        Select Award Type
    </h1>

    <!-- SERVICE -->

    <button class="award-btn"
    onclick="window.location.href='serviceaward.html'">

        Service Awards

    </button>

    <!-- SPECIAL -->

    <button class="award-btn"
    onclick="window.location.href='specialaward.html'">

        Special Awards

    </button>

</div>

</body>
</html>
