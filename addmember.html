<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Add Member</title>

<link rel="stylesheet" href="mobile.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="icon" type="image/png" href="images/BBapplogo.png">

<link rel="apple-touch-icon" href="images/BBapplogo.png">

<link rel="manifest" href="manifest.json">

<style>

body{

margin:0;
font-family:Arial;
background:#f4f5f8;

}


.header{

height:70px;
background:#081f63;
color:white;

display:flex;
align-items:center;

gap:20px;

padding:0 20px;

font-size:22px;
font-weight:bold;

}


button{

border:none;
background:none;
color:white;
font-size:22px;

}


.user{

background:white;

margin:15px 20px;

padding:15px;

border-radius:15px;

display:flex;

align-items:center;

}



.avatar{

width:50px;
height:50px;

border-radius:50%;

background:#081f63;

color:white;

display:flex;

align-items:center;
justify-content:center;

font-size:20px;

margin-right:15px;

}



.info{

flex:1;

}



.name{

font-size:18px;
font-weight:bold;

}


.add{

background:#081f63;

color:white;

padding:8px 15px;

border-radius:10px;

}



</style>


</head>



<body>


<div class="header">


<button onclick="history.back()">

<i class="fa fa-arrow-left"></i>

</button>


Add Member


</div>



<div id="userList">


</div>



<script type="module">


import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getFirestore,
collection,
getDocs,
doc,
updateDoc,
arrayUnion

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {

getAuth,
onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



const firebaseConfig = {

apiKey: "AIzaSyAHmlUT6WBh_lVrMOirhY9Z18xc57fSFZ8",

authDomain: "yb1-ae18e.firebaseapp.com",

projectId: "yb1-ae18e",

storageBucket: "yb1-ae18e.firebasestorage.app",

messagingSenderId: "278406966206",

appId: "1:278406966206:web:3dbf470d1a0c63a8dbe7ef"

};



const app =
initializeApp(firebaseConfig);



const db =
getFirestore(app);

const auth =
getAuth(app);


let currentUID = "";


const group =
JSON.parse(
localStorage.getItem("currentGroup")
);

async function loadGroup(){


const snap =
await getDoc(
doc(db,"groups",group.id)
);



if(snap.exists()){


const freshGroup =
snap.data();


group.members =
freshGroup.members;


group.name =
freshGroup.name;


group.description =
freshGroup.description;



localStorage.setItem(
"currentGroup",
JSON.stringify(group)
);



document.getElementById(
"groupName"
).innerText =
group.name;



document.getElementById(
"groupDescription"
).innerText =
group.description || "No description";



document.getElementById(
"memberCount"
).innerText =
(group.members.length)
+" Members";



loadGroup();


}


}

onAuthStateChanged(auth,(user)=>{

    if(user){

        currentUID = user.uid;

        loadUsers();

    }

});

async function loadUsers(){


const box =
document.getElementById("userList");


box.innerHTML="";


const snapshot =
await getDocs(
collection(db,"users")
);



snapshot.forEach((doc)=>{


if(doc.id === currentUID){

    return;

}


const user = doc.data();


let alreadyMember = 
group.members &&
group.members.includes(user.name);



box.innerHTML += `


<div class="user">


<div class="avatar">

${user.name.charAt(0)}

</div>



<div class="info">


<div class="name">

${user.name}

</div>


</div>



<button

class="add"

${alreadyMember ? "disabled" : ""}

onclick="addMember('${doc.id}')">

${alreadyMember ? "Added" : "Add"}


</button>


</div>


`;


});



}

async function addMember(uid){


const userRef =
doc(db,"users",uid);


const userSnap =
await getDocs(
collection(db,"users")
);



let selectedUser = null;



userSnap.forEach((doc)=>{

    if(doc.id === uid){

        selectedUser = doc.data();

    }

});



if(!selectedUser){

    alert("User not found");

    return;

}

await updateDoc(

doc(db,"groups",group.id),

{

members:arrayUnion(uid)

}

);

alert(
selectedUser.name+" added!"
);

group.members.push(selectedUser.name);

localStorage.setItem(
"currentGroup",
JSON.stringify(group)
);


location.reload();

}

window.addMember = addMember;

</script>



</body>

</html>
