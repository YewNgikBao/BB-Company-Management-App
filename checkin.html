<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Check In</title>

<link rel="stylesheet"
href="mobile.css">

<link rel="icon"
type="image/png"
href="images/BBapplogo.png">

<link rel="apple-touch-icon"
href="images/BBapplogo.png">

<link rel="manifest"
href="manifest.json">

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f1fb;
  padding:20px;
}

.card{
  background:white;
  padding:30px;
  border-radius:20px;
  max-width:500px;
  margin:auto;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.back-btn{
  background:#666;
  color:white;
  border:none;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:20px;
  float:left;
}

h1{
  margin-top:10px;
}

.info{
  text-align:left;
  margin:15px 0;
}

.info p{
  margin:8px 0;
}

input,
select{
  width:90%;
  padding:15px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px;
  margin-top:15px;
  box-sizing:border-box;
}

.confirm-btn{
  background:#0066ff;
  color:white;
  border:none;
  padding:15px 30px;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
  margin-top:20px;
  width:90%;
}

.confirm-btn:disabled{
  background:#aaa;
  cursor:not-allowed;
}

</style>

</head>


<body>


<div class="card">


  <button
  class="back-btn"
  onclick="window.location.href='attendance.html'">

    ← Back

  </button>


  <div style="clear:both;"></div>


  <h1 id="meetingTitle"></h1>


  <div class="info">

    <p id="eventDate"></p>

    <p id="eventTime"></p>

    <p id="eventVenue"></p>

    <p id="eventCheckin"></p>

  </div>


  <!-- NAME -->

  <input
  id="username"
  type="text"
  placeholder="ENTER YOUR NAME"
  autocomplete="name">


  <!-- SQUAD -->

  <select id="squad">

    <option value="">
      SELECT SQUAD
    </option>

    <option value="Squad 1">
      Squad 1
    </option>

    <option value="Squad 2">
      Squad 2
    </option>

    <option value="Squad 3">
      Squad 3
    </option>

    <option value="Squad 4">
      Squad 4
    </option>

    <option value="Squad 5">
      Squad 5
    </option>

    <option value="Squad 6">
      Squad 6
    </option>

    <option value="Squad 7">
      Squad 7
    </option>

  </select>


  <br>


  <button
  id="confirmBtn"
  class="confirm-btn"
  onclick="submitCheckIn()">

    Confirm Check In

  </button>


</div>



<script>


// =========================================
// GET EVENT
// =========================================

const eventData = JSON.parse(

  localStorage.getItem("selectedEvent")

);


// =========================================
// GOOGLE SHEET WEB APP
// =========================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzIQuj5hJZAhS9gDT7QLJ3AuZMpw4q3tXvKocJilHD8P9NmHdmJe6e3xxgzoNrVV6p5/exec";


// =========================================
// CHECK EVENT
// =========================================

if(!eventData){

  alert("No event selected.");

  window.location.href =
    "attendance.html";

}


// =========================================
// DISPLAY EVENT
// =========================================

else{

  document.getElementById(
    "meetingTitle"
  ).innerText =
    eventData.title || "Event";


  document.getElementById(
    "eventDate"
  ).innerText =
    "Date : " +
    (eventData.date || "-");


  document.getElementById(
    "eventTime"
  ).innerText =
    "Time : " +
    (eventData.time || "-");


  document.getElementById(
    "eventVenue"
  ).innerText =
    "Venue : " +
    (eventData.venue || "-");


  document.getElementById(
    "eventCheckin"
  ).innerText =
    "Check In : " +
    (eventData.checkin || "-");

}


// =========================================
// NAME UPPERCASE
// =========================================

const usernameInput =
document.getElementById("username");


usernameInput.addEventListener(
  "input",
  function(){

    usernameInput.value =
      usernameInput.value.toUpperCase();

  }
);


// =========================================
// SUBMIT CHECK IN
// =========================================

window.submitCheckIn = async function(){

  const username =
    document.getElementById("username")
    .value
    .trim();


  const squad =
    document.getElementById("squad")
    .value;


  // =======================================
  // CHECK NAME
  // =======================================

  if(!username){

    alert(
      "Please enter your name."
    );

    return;

  }


  // =======================================
  // CHECK SQUAD
  // =======================================

  if(!squad){

    alert(
      "Please select your squad."
    );

    return;

  }


  const button =
    document.getElementById(
      "confirmBtn"
    );


  button.disabled = true;

  button.innerText =
    "Checking In...";


  try{


    // =====================================
    // PREPARE GOOGLE SHEET DATA
    // =====================================

    const formData =
      new URLSearchParams();


    formData.append(
      "name",
      username
    );


    formData.append(
      "squad",
      squad
    );


    formData.append(
      "event",
      eventData.title || "-"
    );

    formData.append(
      "company",
      eventData.company || "-"
    );

    formData.append(
      "latitude",
      localStorage.getItem("checkinLatitude") || "-"
    );

    formData.append(
      "longitude",
      localStorage.getItem("checkinLongitude") || "-"
    );

    formData.append(
      "distance",
      localStorage.getItem("checkinDistance") || "-"
    );

    // =====================================
    // SEND TO GOOGLE SHEET
    // =====================================

    const response =
      await fetch(

        SCRIPT_URL,

        {

          method:"POST",

          body:formData

        }

      );


    const result =
      await response.text();


    console.log(
      "Google Sheet response:",
      result
    );


    // =====================================
    // ALREADY CHECKED IN
    // =====================================

    if(
      result.trim() ===
      "Already Checked In"
    ){

      alert(

        "You have already checked in.\n\n" +
        "Name: " +
        username

      );


      button.disabled = false;

      button.innerText =
        "Confirm Check In";

      return;

    }


    // =====================================
    // SUCCESS
    // =====================================

    if(
      result.trim() ===
      "Success"
    ){

      alert(
        "Check In Successful!\n\n" +
        "Name: " +
        username +
        "\nSquad: " +
        squad
      );


      window.location.href =
        "attendance.html";


      return;

    }


    // =====================================
    // OTHER RESPONSE
    // =====================================

    alert(

      "Check-in response:\n\n" +
      result

    );


    button.disabled = false;

    button.innerText =
      "Confirm Check In";


  }


  catch(error){

    console.error(
      "CHECK-IN ERROR:",
      error
    );


    alert(

      "Unable to submit your check-in.\n\n" +
      "Please check your internet connection " +
      "and try again."

    );


    button.disabled = false;

    button.innerText =
      "Confirm Check In";

  }

};

</script>


</body>

</html>
