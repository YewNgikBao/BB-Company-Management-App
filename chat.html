function startUnreadMessageListener(){

    if(unsubscribeUnreadMessages){
        unsubscribeUnreadMessages();
    }

    const q = query(
        collectionGroup(db, "messages"),
        where("seen", "==", false)
    );

    unsubscribeUnreadMessages = onSnapshot(
        q,
        (snapshot) => {

            let hasUnread = false;

            snapshot.forEach(docSnap => {

                const msg = docSnap.data();

                // 自己发的讯息不算未读
                if(msg.senderUid === currentUser){
                    return;
                }

                // 被自己隐藏的讯息不算
                if(msg.hiddenFor?.includes(currentUser)){
                    return;
                }

                hasUnread = true;

            });

            updateChatUnreadDot(hasUnread);

        },
        (error) => {

            console.error(
                "Unread message listener error:",
                error
            );

        }
    );
}


function updateChatUnreadDot(show){

    const dot =
        document.getElementById("chatUnreadDot");

    if(!dot) return;

    if(show){

        dot.classList.add("show");

    }else{

        dot.classList.remove("show");

    }

}

        function normalizeMalaysiaPhone(phone){

    phone = phone.trim().replace(/\s+/g,"");

    if(phone.startsWith("+")){
        phone = phone.substring(1);
    }

    if(phone.startsWith("0")){
        phone = "6" + phone;
    }

    if(!phone.startsWith("60")){
        return null;
    }

    if(!/^\d+$/.test(phone)){
        return null;
    }

    if(phone.length < 11 || phone.length > 12){
        return null;
    }

    return phone;
}

async function hideChatForMe(chatId){

    if(!confirm("Hide this chat from All?")){
        return;
    }

    await setDoc(
        doc(
            db,
            "users",
            currentUser,
            "hiddenChats",
            chatId
        ),
        {
            hiddenAt: serverTimestamp()
        }
    );

    hiddenChats[chatId] = true;

    renderChats();
}

window.hideChatForMe = hideChatForMe;

        function loadLastMessages() {

    function watchChat(chatId, displayKey){

        if(!chatId){
            console.error("Invalid chatId:", chatId);
            return;
        }

        const q = query(
            collection(
                db,
                "chats",
                chatId,
                "messages"
            ),
            orderBy("time", "desc"),
            limit(20)
        );

        onSnapshot(q, (snapshot) => {

            let latestMessage = null;

            // 从最新开始找第一条自己没有隐藏的讯息
            for(const docSnap of snapshot.docs){

                const msg = docSnap.data();

                // 自己隐藏的讯息不要显示
                if(msg.hiddenFor?.includes(currentUser)){
                    continue;
                }

                // 被 block 的人发的讯息不要显示
                if(
                    msg.senderUid !== currentUser &&
                    blockedUsers[msg.senderUid]
                ){
                    continue;
                }

                latestMessage = msg;
                break;
            }


            if(!latestMessage){

                lastMessages[displayKey] = "No messages";

            }else{

                let text = latestMessage.text || "";

                // 如果讯息被 recall
                if(latestMessage.recalled){

                    text = "This message was recalled";

                }

                // 群组显示谁发的
                if(
                    latestMessage.senderUid !== currentUser
                ){
                    text =
                        latestMessage.sender +
                        ": " +
                        text;
                }

                lastMessages[displayKey] = text;

            }

            renderChats();

        }, (error) => {

            console.error(
                "Last message listener error:",
                error
            );

        });

    }


    /* =========================
       WATCH GROUPS
    ========================= */

    groups.forEach(group => {

        if(group.name === "Saved Messages"){
            return;
        }

            function renderMessages() {

                const box =
                    document.getElementById("messages");

                const q = query(

                    collection(
                        db,
                        "chats",
                        currentChat,
                        "messages"
                    ),

                    orderBy("time")

                );

                if(unsubscribeMessages){
                    unsubscribeMessages();
                }

                unsubscribeMessages = onSnapshot(q, (snapshot) => {

                    box.innerHTML = "";

                    let lastDate = "";

                    unreadCount[currentChat] = 0;

                    let unread = 0;

                    snapshot.forEach(async (docSnap) => {

                        const msg = docSnap.data();

                        if(msg.senderUid !== currentUser){

                            if(!msg.seen){

                                unread++;

                                await updateDoc(
                                    doc(
                                        db,
                                        "chats",
                                        currentChat,
                                        "messages",
                                        docSnap.id
                                    ),
                                    {
                                        seen:true
                                    }
                                );

                            }

                        }

                    });

                    unreadCount[currentChat] = unread;

                    renderChats();

                    snapshot.forEach((doc) => {

                        const msg = doc.data();

                        if(msg.hiddenFor?.includes(currentUser)){
                            return;
                        }

                        if(blockedUsers[msg.senderUid]){
                            return;
                        }
                        
                        if(msg.recalled){

                            let time = "";

                            if(msg.time?.seconds){

                                time = new Date(
                                    msg.time.seconds * 1000
                                ).toLocaleTimeString([],{
                                    hour: "2-digit",
                                    minute: "2-digit"
                                });

                            }

                            box.innerHTML += `

                                <div class="message ${msg.senderUid === currentUser ? "me" : "other"} recalled">

                                    <em>This message was recalled</em>

                                    <small>${time}</small>

                                </div>

                            `;

                            return;
                        }

                        if (!msg.time) return;

                        const messageDate = new Date(
                            msg.time.seconds * 1000
                        );

                        const currentDate = messageDate.toDateString();

                        if (currentDate !== lastDate) {

                            let label = currentDate;

                            const today = new Date().toDateString();

                            const yesterday = new Date(
                                Date.now() - 86400000
                            ).toDateString();

                            if (currentDate === today) {

                                label = "Today";

                            } else if (currentDate === yesterday) {

                                label = "Yesterday";

                            }

                            box.innerHTML += `
                                <div class="date-divider">
                                    ${label}
                                </div>
                            `;

                            lastDate = currentDate;
                        }

                        const safeText = msg.text.replace(/'/g, "\\'");

                        let time = "";

                        if (msg.time && msg.time.seconds) {

                            time = new Date(
                                msg.time.seconds * 1000
                            ).toLocaleTimeString([], {
                                hour: "2-digit",
                                minute: "2-digit"
                            });

                        }

                        const selectedClass =
                            selectedMessages.includes(doc.id)
                            ? "selected"
                            : "";

                        const clickAction = isSelecting
                            ? `toggleMessageSelection('${doc.id}')`
                            : "";

                       box.innerHTML += `

                       <div
                       id="msg-${doc.id}"
                       class="message ${msg.senderUid === currentUser ? "me" : "other"} ${selectedClass}"

                       onclick="${clickAction}"

                       oncontextmenu="
                       openContextMenu(

                       )

                       ontouchstart="
                       startPress(
                           '${doc.id}',
                           '${safeText}',
                           '${msg.sender}'
                       )
                       "

                       ontouchend="cancelPress()"
                       >

                       <div class="msg-text">

                       ${

                           <div class="reply-message">
                               <strong>${msg.reply.sender}</strong><br>
                               ${msg.reply.text}

                       ` : ""}

                       ${msg.text}

                       </div>

            function searchMessages(){

                .value

                .toLowerCase();

                searchResults=[];

                currentSearchIndex=0;

                document
                .querySelectorAll(".msg-text")
                .forEach(msg=>{

                    msg.classList.remove("search-highlight");

                });

                if(keyword===""){

                    document.getElementById("searchCount").innerText="0/0";

                    return;
            
                }

                const msgs=
                document.querySelectorAll(".msg-text");

                msgs.forEach(msg=>{

                    if(msg.innerText.toLowerCase().includes(keyword)){

                        msg.classList.add("search-highlight");

                        searchResults.push(msg);

                    }
            
                });

                if(searchResults.length>0){

                    jumpToResult(0);

                }

                document.getElementById("searchCount").innerText=

                searchResults.length===0
            
                ?

                "0/0"
            
                :

                `1/${searchResults.length}`;

            }

            function jumpToResult(index){

                if(searchResults.length===0)return;

                currentSearchIndex=index;

                searchResults[index]

                .scrollIntoView({
            
                    behavior:"smooth",

                    block:"center"

                });

                document.getElementById(

                    "searchCount"

                ).innerText=

                `${index+1}/${searchResults.length}`;

            }

            function nextResult(){

                if(searchResults.length===0)return;

                currentSearchIndex++;

                if(currentSearchIndex>=searchResults.length){

                    currentSearchIndex=0;
            
                }

                jumpToResult(currentSearchIndex);

            }

            function previousResult(){

                if(searchResults.length===0)return;

                currentSearchIndex--;

                if(currentSearchIndex<0){

                    currentSearchIndex=

                    searchResults.length-1;

                }

                jumpToResult(currentSearchIndex);

            }

            async function editSelectedMessage() {

                    prompt(
                        "Edit message",

                if (!newText) return;

                await updateDoc(

                    doc(
                        db,
                        "chats",
                        currentChat,
                        "messages",
                        selectedMessageId

                        text: newText,
                        edited: true

            async function deleteSelectedMessage(){

                if(!confirm("Delete for you only?")) return;

                await updateDoc(

                    doc(
                        db,
                        "chats",
                        currentChat,
                        "messages",
                        selectedMessageId
                    ),

                    {
                        hiddenFor: arrayUnion(currentUser)
                    }

            }

            function startSelectMode(){

                isSelecting = true;
                selectedMessages = [];

                document.getElementById(
                    "selectBar"
                ).style.display = "flex";

                closeMessageMenu();

                renderMessages();
            }
            
            function cancelSelectMode(){

                isSelecting = false;
                selectedMessages = [];

                document.getElementById(
                    "selectBar"
                ).style.display = "none";

                renderMessages();
            }

            function toggleMessageSelection(id){

                if(selectedMessages.includes(id)){

                    selectedMessages =
                        selectedMessages.filter(
                            item => item !== id
                        );

                } else {

                    selectedMessages.push(id);

                }

                document.getElementById(
                    "selectedCount"
                ).innerText =
                    `${selectedMessages.length} selected`;

                document
                    .querySelectorAll(".message")
                    .forEach(msg => {
                        msg.classList.remove("selected");
                    });

                selectedMessages.forEach(messageId => {

                    const element = document.getElementById(
                        `msg-${messageId}`
                    );

                    if(element){

                        element.classList.add("selected");

                    }

                });

            }

            async function deleteSelectedMessages(){

                console.log(selectedMessages);

                if(selectedMessages.length === 0) return;

                if(
                    !confirm(
                        `Delete ${selectedMessages.length} messages?`
                    )
                ) return;

                for(const id of selectedMessages){

                    await updateDoc(

                        doc(
                            db,
                            "chats",
                            currentChat,
                            "messages",
                            id
                        ),

                        {
                            hiddenFor: arrayUnion(currentUser)
                        }

                    );

               }

                cancelSelectMode();
            }

                if(!confirm("Recall this message for everyone?")) return;

                await updateDoc(

                    doc(
                        db,

                        currentChat,
                        "messages",
                        selectedMessageId
                    ),

                    {
                        recalled: true,

                );

            }

            async function dissolveGroup(){

                console.log("owner =", currentGroup.owner);
                console.log("currentUser =", currentUser);

                if(currentGroup.owner !== currentUser){

                    alert("Only the group owner can dissolve this group.");

                    return;

                }

                if(
                    !confirm("Dissolve this group permanently?")
                ) return;

                try{

                const messageSnapshot =
                await getDocs(
                    collection(
                        db,
                        "chats",
                        currentChat,
                        "messages"
                    )
                );

                for(const message of messageSnapshot.docs){

                    await deleteDoc(message.ref);

                }

                await deleteDoc(
                    doc(db,"chats",currentChat)
                );

                await deleteDoc(
                    doc(db,"groups",currentGroup.id)
                );

                            closeGroupMenu();
                            closeChatRoom();
            
                            await loadGroups();

                        }catch(error){

                                console.log(error);
                                alert("Failed to dissolve group.");

                            }

            }
