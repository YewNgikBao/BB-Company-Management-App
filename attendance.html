<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Attendance</title>

<link rel="stylesheet" href="mobile.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="icon" type="image/png" href="images/BBapplogo.png">

<link rel="apple-touch-icon" href="images/BBapplogo.png">

<link rel="manifest" href="manifest.json">

<style>

body{
  margin:0;
  font-family:Arial;
  background:#f4f1fb;
  padding-bottom:100px;
}

.header{
  background:rgba(0,0,50,0.7);
  color:white;
  padding:15px;
  display:flex;
  align-items:center;
  gap:15px;
}

.header img{
  width:70px;
}

.header-text h1{
  margin:0;
  font-size:32px;
}

.header-text p{
  margin:0;
  font-size:16px;
}

.container{
  padding:20px;
}

#announcementBox{
  padding:0 20px;
}

#announcementBox > div{
  margin:20px 0 !important;
}

.card{
  background:white;
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  box-sizing:border-box;
  width:100%;
}

@media (max-width:600px){

  .container{
    padding:10px;
    box-sizing:border-box;
    width:100%;
  }

  .card{
    width:100%;
    max-width:100%;
    box-sizing:border-box;

    display:flex;
    align-items:center;

    gap:12px;

    padding:12px;

    overflow:hidden;
  }

  /* =========================
     左边资料
  ========================= */

  .card > div{
    flex:1 1 auto;
    min-width:0;
    width:0;
  }

  .card h2{
    margin:0 0 8px 0;

    /*
      手机越小，字体稍微缩小
      但不会缩得太小
    */
    font-size:clamp(14px, 4.5vw, 18px);

    white-space:nowrap;
  }

  .card p{
    margin:5px 0;

    font-size:clamp(11px, 3.4vw, 14px);

    white-space:nowrap;
  }

}

.card{
  background:white;
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  box-sizing:border-box;
  width:100%;
}


/* =========================
   CHECK IN BUTTON
========================= */

.check-btn{
  width:110px;
  min-width:110px;
  height:42px;

  padding:0 16px;

  margin:0;

  border:none;
  border-radius:8px;

  background:#0066ff;
  color:white;

  font-size:14px;
  font-weight:normal;

  cursor:pointer;

  box-sizing:border-box;

  white-space:nowrap;

  flex-shrink:0;
}

.enabled{
  background:#0066ff;
  color:white;
}

.disabled{
  background:#bfbfbf;
  color:white;
  cursor:not-allowed;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
}

.nav-item{
  text-align:center;
  color:#777;
}

.active{
  color:#c79b1b;
}

.nav-item i{
  font-size:24px;
}

</style>
</head>

<body>

<div class="header">

  <img src="images/bb.logo.png">
  <div class="header-text">

  <h1>BB COMPANY</h1>
  <p>MANAGEMENT APP</p>

  </div>

</div>

<div id="announcementBox"></div>

<div class="container"
id="eventsContainer">
</div>

<div class="bottom-nav">

  <div class="nav-item"
  onclick="window.location.href='dashboard.html'">

    <i class="fa-solid fa-house"></i>
    <div>Home</div>

  </div>

  <div class="nav-item active">

    <i class="fa-regular fa-calendar-check"></i>
    <div>Attendance</div>

  </div>

  <div class="nav-item"
  onclick="window.location.href='chat.html'">

    <i class="fa-regular fa-comments"></i>
    <div>Chat</div>

  </div>

  <div class="nav-item"
  onclick="window.location.href='achievements.html'">

    <i class="fa-solid fa-trophy"></i>
    <div>Achievements</div>

  </div>

  <div class="nav-item"
  onclick="window.location.href='profile.html'">

  <i class="fa-regular fa-user"></i>
  <div>Profiles</div>

</div>
</div>

<script src="app-update.js"></script>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  doc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// FIREBASE CONFIG
const firebaseConfig = {

  apiKey: "AIzaSyAHmlUT6WBh_lVrMOirhY9Z18xc57fSFZ8",

  authDomain: "yb1-ae18e.firebaseapp.com",

  projectId: "yb1-ae18e",

  storageBucket: "yb1-ae18e.firebasestorage.app",

  messagingSenderId: "278406966206",

  appId: "1:278406966206:web:3dbf470d1a0c63a8dbe7ef"

};


// START FIREBASE
const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);


// REALTIME ANNOUNCEMENTS

const announcementBox =
document.getElementById(
  "announcementBox"
);

onSnapshot(

  collection(db,"announcements"),

  (snapshot)=>{

    announcementBox.innerHTML = "";

    snapshot.forEach(doc=>{

      const data = doc.data();

      announcementBox.innerHTML += `

        <div style="
          background:#fff3cd;
          padding:20px;
          border-radius:20px;
          box-shadow:0 4px 10px rgba(0,0,0,0.2);
        ">

          <h3>
          ${data.title}
          </h3>

          <p>
          ${data.message}
          </p>

          <small>
          ${data.date}
          </small>

        </div>

      `;
    });

  }

);


// LOAD EVENTS
async function loadEvents(){

  const container =
    document.getElementById("eventsContainer");

  container.innerHTML = `
    <p style="text-align:center;color:#777;">
      Loading attendance...
    </p>
  `;

  try{

    // =========================================
    // GET CURRENT USER
    // =========================================

    const user = auth.currentUser;

    if(!user){

      container.innerHTML = `
        <p style="text-align:center;color:#777;">
          Please log in first.
        </p>
      `;

      return;
    }


    // =========================================
    // GET USER PROFILE
    // =========================================

    const userRef =
      doc(
        db,
        "users",
        user.uid
      );

    const userSnap =
      await getDoc(userRef);


    if(!userSnap.exists()){

      container.innerHTML = `
        <p style="text-align:center;color:red;">
          User profile not found.
        </p>
      `;

      return;
    }


    const userData =
      userSnap.data();


    // =========================================
    // GET USER COMPANY
    // =========================================

    const userCompany =
      (userData.company || "").trim();


    console.log(
      "Current User:",
      user.uid
    );

    console.log(
      "Current Company:",
      userCompany
    );


    if(!userCompany){

      container.innerHTML = `
        <div style="
          background:white;
          padding:30px;
          border-radius:20px;
          text-align:center;
          color:#777;
        ">

          <i
            class="fa-solid fa-building"
            style="
              font-size:45px;
              color:#3c4d78;
              margin-bottom:15px;
            ">
          </i>

          <h3>
            No Company Assigned
          </h3>

          <p>
            You have not been assigned
            to a Company yet.
          </p>

        </div>
      `;

      return;
    }


    // =========================================
    // GET ALL EVENTS
    // =========================================

    const snapshot =
      await getDocs(
        collection(db,"events")
      );


    container.innerHTML = "";

    const dashboardEvents = [];

    let visibleEventCount = 0;


    // =========================================
    // FILTER EVENTS BY COMPANY
    // =========================================

    snapshot.forEach(doc => {

      const data = doc.data();


      // IMPORTANT:
      // Event must have a company field

      const eventCompany =
        (data.company || "").trim();


      console.log(
        "Event:",
        data.title,
        "Company:",
        eventCompany
      );


      // =======================================
      // ONLY SHOW SAME COMPANY
      // =======================================

      if(
        eventCompany.toLowerCase() !==
        userCompany.toLowerCase()
      ){

        return;

      }


      visibleEventCount++;

      window[`event_${doc.id}`] = data;


      dashboardEvents.push({

        title: data.title,

        date: data.date,

        time: data.time,

        venue: data.venue

      });


      // =======================================
      // DASHBOARD NOTIFICATION
      // =======================================

      const notifications =
  JSON.parse(
    localStorage.getItem(
      "dashboardNotifications"
    )
  ) || [];


const exists =
  notifications.some(

    item =>

      item.eventTitle === data.title &&

      item.date === data.date

  );


if(!exists){

  notifications.push({

    title:
      "Attendance Reminder",

    eventTitle:
      data.title,

    date:
      data.date,

    message:
      `${data.title} on ${data.date} at ${data.time}`

  });


  localStorage.setItem(

    "dashboardNotifications",

    JSON.stringify(
      notifications
    )

  );

}


      localStorage.setItem(

        "events",

        JSON.stringify(
          dashboardEvents
        )

      );


      // =======================================
      // CHECK EVENT TIME
      // =======================================

      const now =
        new Date();


      const current =
        now.getHours() * 60 +
        now.getMinutes();


      const start =
        data.startHour * 60 +
        data.startMinute;


      const end =
        data.endHour * 60 +
        data.endMinute;


      let buttonClass =
        "disabled";


      let disabled =
        "disabled";


      const today =
        new Date();


      const eventDate =
        new Date(
          data.date
            .split("/")
            .reverse()
            .join("-")
        );


      const sameDay =

        today.getFullYear() ===
        eventDate.getFullYear()

        &&

        today.getMonth() ===
        eventDate.getMonth()

        &&

        today.getDate() ===
        eventDate.getDate();


      if(

        sameDay &&

        current >= start &&

        current <= end

      ){

        buttonClass =
          "enabled";

        disabled = "";

      }


      // =======================================
      // DISPLAY EVENT
      // =======================================

      container.innerHTML += `

        <div class="card">

          <div>

            <h2>
              ${data.title}
            </h2>

            <p>
              Company : ${data.company}
            </p>

            <p>
              Date : ${data.date}
            </p>

            <p>
              Time : ${data.time}
            </p>

            <p>
              Clothes : ${data.clothes}
            </p>

            <p>
              Venue : ${data.venue}
            </p>

            <p>
              Check in :
              ${data.checkin}
            </p>

          </div>


          <button

            class="check-btn ${buttonClass}"

            ${disabled}

            onclick="
              checkIn('${doc.id}')
            ">

            Check In

          </button>

        </div>

      `;

    });


    // =========================================
    // NO EVENTS FOR THIS COMPANY
    // =========================================

    if(visibleEventCount === 0){

      container.innerHTML = `

        <div style="
          background:white;
          padding:40px 20px;
          border-radius:20px;
          text-align:center;
          color:#777;
        ">

          <i
            class="fa-regular fa-calendar-xmark"
            style="
              font-size:50px;
              color:#3c4d78;
              margin-bottom:15px;
            ">
          </i>

          <h3>
            No Attendance Events
          </h3>

          <p>
            There are currently no
            attendance events for
            <strong>
              ${userCompany}
            </strong>.
          </p>

        </div>

      `;

    }

  }

  catch(error){

    console.error(
      "LOAD EVENTS ERROR:",
      error
    );


    container.innerHTML = `

      <div style="
        background:white;
        padding:30px;
        border-radius:20px;
        text-align:center;
        color:red;
      ">

        Failed to load attendance.

        <br><br>

        ${error.message}

      </div>

    `;

  }

}


// =========================================
// CHECK IN
// =========================================

window.checkIn = function(id){

  const eventData =
    window[`event_${id}`];

  if(!eventData){

    alert(
      "Event information not found."
    );

    return;
  }


  // =========================================
  // TIAN EN METHODIST CHURCH
  // =========================================

const churchLatitude = Number(eventData.latitude);
const churchLongitude = Number(eventData.longitude);
const allowedRadius = Number(eventData.allowedRadius);


  // =========================================
  // CHECK GEOLOCATION
  // =========================================

  if(!navigator.geolocation){

    alert(
      "Your device does not support location services."
    );

    return;
  }


  // =========================================
  // GET CURRENT LOCATION
  // =========================================

  navigator.geolocation.getCurrentPosition(

    async function(position){

      try{

        const latitude =
          position.coords.latitude;

        const longitude =
          position.coords.longitude;

        const accuracy =
          position.coords.accuracy;


        // =====================================
        // CALCULATE DISTANCE
        // =====================================

        function calculateDistance(
          lat1,
          lon1,
          lat2,
          lon2
        ){

          const R = 6371000;

          const dLat =
            (lat2 - lat1) *
            Math.PI / 180;

          const dLon =
            (lon2 - lon1) *
            Math.PI / 180;


          const a =
            Math.sin(dLat / 2) *
            Math.sin(dLat / 2) +

            Math.cos(
              lat1 * Math.PI / 180
            ) *

            Math.cos(
              lat2 * Math.PI / 180
            ) *

            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);


          const c =
            2 *
            Math.atan2(
              Math.sqrt(a),
              Math.sqrt(1 - a)
            );


          return R * c;

        }


        const distance =
          calculateDistance(
            latitude,
            longitude,
            churchLatitude,
            churchLongitude
          );


        console.log(
          "Latitude:",
          latitude
        );

        console.log(
          "Longitude:",
          longitude
        );

        console.log(
          "Accuracy:",
          accuracy,
          "meters"
        );

        console.log(
          "Distance:",
          distance,
          "meters"
        );


        // =====================================
        // CHECK LOCATION
        // =====================================

        if(distance > allowedRadius){

          alert(

            "You are not at Tian En Methodist Church.\n\n" +

            "Check-in is only available within " +

            allowedRadius +

            " meters of the church.\n\n" +

            "Your distance: " +

            Math.round(distance) +

            " meters"

          );

          return;
        }

        localStorage.setItem(
  "selectedEvent",
  JSON.stringify(eventData)
);

localStorage.setItem(
  "checkinLatitude",
  latitude
);

localStorage.setItem(
  "checkinLongitude",
  longitude
);

localStorage.setItem(
  "checkinDistance",
  Math.round(distance)
);

window.location.href = "checkin.html";


        // =====================================
        // OTHER RESPONSE
        // =====================================

      }


      catch(error){

        console.error(
          "CHECK-IN ERROR:",
          error
        );


        alert(

          "Unable to submit your check-in.\n\n" +

          "Please check your internet connection " +

          "and try again."

        );

      }

    },


    // =========================================
    // LOCATION ERROR
    // =========================================

    function(error){

      console.error(
        "LOCATION ERROR:",
        error.code,
        error.message
      );


      if(
        error.code === 1
      ){

        alert(

          "Location permission is required " +
          "to check in.\n\n" +

          "Please allow location access " +
          "and try again."

        );

      }


      else if(
        error.code === 2
      ){

        alert(

          "Your location could not be detected.\n\n" +

          "Please turn on GPS/location services " +
          "and try again."

        );

      }


      else if(
        error.code === 3
      ){

        alert(

          "Location request timed out.\n\n" +

          "Please try again."

        );

      }


      else{

        alert(

          "Unable to get your location.\n\n" +

          "Please try again."

        );

      }

    },


    // =========================================
    // LOCATION SETTINGS
    // =========================================

    {
      enableHighAccuracy: true,

      timeout: 10000,

      maximumAge: 0
    }

  );

};

onAuthStateChanged(
  auth,
  (user) => {

    if(user){

      loadEvents();

    }

    else{

      console.log(
        "No user logged in."
      );

    }

  }
);


</script>

</body>
</html>
