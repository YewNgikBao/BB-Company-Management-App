<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"

<link rel="stylesheet" href="mobile.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="icon" type="image/png" href="images/BBapplogo.png">

<link rel="apple-touch-icon" href="images/BBapplogo.png">

<link rel="manifest" href="manifest.json">

<style>

body{
  margin:0;
  font-family:Arial;
  background:#f4f1fb;
  padding-bottom:100px;
}

.header{
  background:rgba(0,0,50,0.7);
  color:white;

  display:flex;
  align-items:center;

}

.header img{

.header-text h1{

.header-text p{

.card{
  background:white;

  padding:20px;

}

.check-btn{
  border:none;
  padding:18px 25px;
  border-radius:10px;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.enabled{
  background:#0066ff;
}

.disabled{
  background:#bfbfbf;
  cursor:not-allowed;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:white;
  display:flex;

.nav-item{
  text-align:center;

}

.active{
  color:#c79b1b;
}

  font-size:24px;
}

</style>
</head>

<body>

<div class="header">

  <img src="images/bb.logo.png">
  <div class="header-text">

  <h1>BB COMPANY</h1>
  <p>MANAGEMENT APP</p>

  </div>

</div>

<div id="announcementBox"></div>

<div class="container"
id="eventsContainer">
</div>

<div class="bottom-nav">

  <div class="nav-item"
  onclick="window.location.href='dashboard.html'">

    <i class="fa-solid fa-house"></i>
    <div>Home</div>

  </div>

  <div class="nav-item active">

    <i class="fa-regular fa-calendar-check"></i>
    <div>Attendance</div>

  </div>

  <div class="nav-item"
  onclick="window.location.href='chat.html'">

    <i class="fa-regular fa-comments"></i>
    <div>Chat</div>

  </div>

  <div class="nav-item"
  onclick="window.location.href='achievements.html'">

    <i class="fa-solid fa-trophy"></i>
    <div>Achievements</div>

  </div>

  <div class="nav-item"
  onclick="window.location.href='profile.html'">

  <i class="fa-regular fa-user"></i>
  <div>Profiles</div>

</div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// FIREBASE CONFIG
const firebaseConfig = {

  apiKey: "AIzaSyAHmIUT6Wbh_lVrMoirhY9Z18xc57fSFZ8",

  authDomain: "yb1-ae18e.firebaseapp.com",

  projectId: "yb1-ae18e",

  storageBucket: "yb1-ae18e.firebasestorage.app",

  messagingSenderId: "278406966206",

  appId: "1:278406966206:web:3dbf470d1a0c63a8dbe7ef"

};


// START FIREBASE
const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


// REALTIME ANNOUNCEMENTS

const announcementBox =
document.getElementById(
  "announcementBox"
);

onSnapshot(

  collection(db,"announcements"),

  (snapshot)=>{

    announcementBox.innerHTML = "";

    snapshot.forEach(doc=>{

      const data = doc.data();

      announcementBox.innerHTML += `

        <div style="
          background:#fff3cd;
          margin:20px;
          padding:15px;
          border-radius:15px;
          box-shadow:0 2px 5px rgba(0,0,0,0.1);
        ">

          <h3>
          ${data.title}
          </h3>

          <p>
          ${data.message}
          </p>

          <small>
          ${data.date}
          </small>

        </div>

      `;
    });

  }

);


// LOAD EVENTS
async function loadEvents(){

  const snapshot =
  await getDocs(
    collection(db,"events")
  );

  const container =
  document.getElementById(
    "eventsContainer"
  );

  container.innerHTML = "";

  const dashboardEvents = [];

  snapshot.forEach(doc => {

  const data = doc.data();

  window[`event_${doc.id}`] = data;

  dashboardEvents.push({
    title: data.title,
    date: data.date,
    time: data.time,
    venue: data.venue
  });

  const notifications = JSON.parse(
    localStorage.getItem("dashboardNotifications")
  ) || [];

  const exists = notifications.some(
    item => item.title === data.title
  );

  if (!exists) {

    notifications.push({
      title: "Attendance Reminder",
      message: `${data.title} on ${data.date} at ${data.time}`
    });

    localStorage.setItem(
      "dashboardNotifications",
      JSON.stringify(notifications)
    );
  }

  localStorage.setItem(
    "events",
    JSON.stringify(dashboardEvents)
  );

  const now = new Date();

  const current =
  now.getHours() * 60 +
  now.getMinutes();

  const start =
  data.startHour * 60 +
  data.startMinute;

  const end =
  data.endHour * 60 +
  data.endMinute;

  let buttonClass =
  "disabled";

  let disabled =
  "disabled";

  const today = new Date();

  const eventDate = new Date(
    data.date.split("/").reverse().join("-")
  );

  const sameDay =
    today.getFullYear() === eventDate.getFullYear() &&
    today.getMonth() === eventDate.getMonth() &&
    today.getDate() === eventDate.getDate();

    console.log(
  "Today:",
  today,
  "Event:",
  eventDate,
  "Same Day:",
  sameDay
);                                                        

  if (
    sameDay &&
    current >= start &&
    current <= end
  ){

    buttonClass = "enabled";
    disabled = "";
  }

  container.innerHTML += `

    <div class="card">

      <div>

        <h2>${data.title}</h2>

        <p>Date : ${data.date}</p>

        <p>Time : ${data.time}</p>

        <p>Clothes : ${data.clothes}</p>

        <p>Venue : ${data.venue}</p>

        <p>
        Check in :
        ${data.checkin}
        </p>

      </div>

      <button
      class="check-btn ${buttonClass}"
      ${disabled}

      onclick="checkIn('${doc.id}')">

        Check In

      </button>

    </div>

  `;
});

// =========================================
// GOOGLE SHEETS WEB APP
// =========================================

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxdU2EUTr8UR2gWyJepG68XsgJbgejPnQJl27uth1WGhSCQKrPbuaUwdHVhtR2INfZ20g/exec";


// =========================================
// CHECK IN
// =========================================

window.checkIn = async function(id){

  const eventData =
    window[`event_${id}`];

  if(!eventData){

    alert(
      "Event information not found."
    );

    return;
  }


  // =========================================
  // GET USER INFORMATION
  // =========================================

  const uid =
    localStorage.getItem("uid") || "-";

  const name =
    localStorage.getItem("name") || "-";

  const squad =
    localStorage.getItem("squad") || "-";


  if(
    name === "-" ||
    name.trim() === ""
  ){

    alert(
      "Your name could not be found.\n\n" +
      "Please login again."
    );

    return;
  }


  // =========================================
  // TIAN EN METHODIST CHURCH
  // =========================================

  const churchLatitude =
    2.28796;

  const churchLongitude =
    111.82779;


  // Allow 100 meters

  const allowedRadius =
    100;


  // =========================================
  // CHECK GEOLOCATION
  // =========================================

  if(!navigator.geolocation){

    alert(
      "Your device does not support location services."
    );

    return;
  }


  // =========================================
  // GET CURRENT LOCATION
  // =========================================

  navigator.geolocation.getCurrentPosition(

    async function(position){

      try{

        const latitude =
          position.coords.latitude;

        const longitude =
          position.coords.longitude;

        const accuracy =
          position.coords.accuracy;


        // =====================================
        // CALCULATE DISTANCE
        // =====================================

        function calculateDistance(
          lat1,
          lon1,
          lat2,
          lon2
        ){

          const R = 6371000;

          const dLat =
            (lat2 - lat1) *
            Math.PI / 180;

          const dLon =
            (lon2 - lon1) *
            Math.PI / 180;


          const a =
            Math.sin(dLat / 2) *
            Math.sin(dLat / 2) +

            Math.cos(
              lat1 * Math.PI / 180
            ) *

            Math.cos(
              lat2 * Math.PI / 180
            ) *

            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);


          const c =
            2 *
            Math.atan2(
              Math.sqrt(a),
              Math.sqrt(1 - a)
            );


          return R * c;

        }


        const distance =
          calculateDistance(
            latitude,
            longitude,
            churchLatitude,
            churchLongitude
          );


        console.log(
          "Latitude:",
          latitude
        );

        console.log(
          "Longitude:",
          longitude
        );

        console.log(
          "Accuracy:",
          accuracy,
          "meters"
        );

        console.log(
          "Distance:",
          distance,
          "meters"
        );


        // =====================================
        // CHECK LOCATION
        // =====================================

        if(
          distance >
          allowedRadius
        ){

          alert(

            "You are not at Tian En Methodist Church.\n\n" +

            "Check-in is only available within " +

            allowedRadius +

            " meters of the church.\n\n" +

            "Your distance: " +

            Math.round(distance) +

            " meters"

          );

          return;
        }


        // =====================================
        // PREPARE DATA FOR GOOGLE SHEET
        // =====================================

        const formData =
          new URLSearchParams();


        formData.append(
          "name",
          name
        );


        formData.append(
          "squad",
          squad
        );


        formData.append(
          "event",
          eventData.title || "-"
        );


        formData.append(
          "latitude",
          latitude
        );


        formData.append(
          "longitude",
          longitude
        );


        formData.append(
          "distance",
          Math.round(distance)
        );


        // =====================================
        // SEND TO GOOGLE SHEETS
        // =====================================

        const response =
          await fetch(
            SCRIPT_URL,
            {
              method: "POST",

              body: formData
            }
          );


        const result =
          await response.text();


        console.log(
          "Google Sheet response:",
          result
        );


        // =====================================
        // ALREADY CHECKED IN
        // =====================================

        if(
          result.trim() ===
          "Already Checked In"
        ){

          alert(

            "You have already checked in today.\n\n" +

            "Name: " +
            name

          );

          return;
        }


        // =====================================
        // SUCCESS
        // =====================================

        if(
          result.trim() ===
          "Success"
        ){

          localStorage.setItem(
            "selectedEvent",
            JSON.stringify(eventData)
          );


          alert(

            "Check-in successful!\n\n" +

            "Name: " +
            name +

            "\n\nLocation verified."

          );


          window.location.href =
            "checkin.html";

          return;
        }


        // =====================================
        // OTHER RESPONSE
        // =====================================

        alert(
          "Check-in response:\n\n" +
          result
        );

      }


      catch(error){

        console.error(
          "CHECK-IN ERROR:",
          error
        );


        alert(

          "Unable to submit your check-in.\n\n" +

          "Please check your internet connection " +

          "and try again."

        );

      }

    },


    // =========================================
    // LOCATION ERROR
    // =========================================

    function(error){

      console.error(
        "LOCATION ERROR:",
        error.code,
        error.message
      );


      if(
        error.code === 1
      ){

        alert(

          "Location permission is required " +
          "to check in.\n\n" +

          "Please allow location access " +
          "and try again."

        );

      }


      else if(
        error.code === 2
      ){

        alert(

          "Your location could not be detected.\n\n" +

          "Please turn on GPS/location services " +
          "and try again."

        );

      }


      else if(
        error.code === 3
      ){

        alert(

          "Location request timed out.\n\n" +

          "Please try again."

        );

      }


      else{

        alert(

          "Unable to get your location.\n\n" +

          "Please try again."

        );

      }

    },


    // =========================================
    // LOCATION SETTINGS
    // =========================================

    {
      enableHighAccuracy: true,

      timeout: 10000,

      maximumAge: 0
    }

  );

};

}

loadEvents();


</script>

</body>
</html>
